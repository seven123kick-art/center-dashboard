<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>経営管理システム｜センター選択</title>
<link rel="stylesheet" href="assets/css/landing.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236d5bd0'/%3E%3Cpath d='M18 18h28v28H18z' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M23 39V31h5v8m4 0V25h5v14m4 0V28h5v11' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
</head>
<body>
<main class="landing-main">
  <header class="landing-header">
    <div class="brand-line">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="20" rx="5"/><path d="M10 21v-5h3v5m3 0V11h3v10m3 0v-8h3v8"/></svg>
      </div>
      <div>
        <div class="brand-kicker">MANAGEMENT SYSTEM</div>
        <h1>経営管理システム</h1>
      </div>
    </div>
    <div class="header-date" aria-label="本日の日付">
      <span>本日</span><strong id="today-label">----</strong>
    </div>
  </header>

  <section class="selection-area" aria-labelledby="center-select-title">
    <div class="section-heading">
      <h2 id="center-select-title">使用するセンターを選択</h2>
      <p>センターを選ぶとダッシュボードを開きます。</p>
    </div>

    <div class="center-grid">
      <a class="center-card center-card--kitasaitama" href="center.html?c=kitasaitama" aria-label="北埼玉センターを開く">
        <div class="card-decoration" aria-hidden="true"></div>
        <div class="character-stage" aria-hidden="true">
          <div class="character-placeholder">
            <span class="placeholder-mark">ら</span>
            <small>CHARACTER IMAGE</small>
          </div>
        </div>
        <div class="center-content">
          <span class="center-tag">北埼玉</span>
          <span class="center-sub">KITASAITAMA CENTER</span>
          <h3>北埼玉センター</h3>
          <div class="center-action">開く <b>→</b></div>
        </div>
      </a>

      <a class="center-card center-card--toda" href="center.html?c=toda" aria-label="戸田センターを開く">
        <div class="card-decoration" aria-hidden="true"></div>
        <div class="character-stage" aria-hidden="true">
          <div class="character-placeholder">
            <span class="placeholder-mark">こ</span>
            <small>CHARACTER IMAGE</small>
          </div>
        </div>
        <div class="center-content">
          <span class="center-tag">戸田</span>
          <span class="center-sub">TODA CENTER</span>
          <h3>戸田センター</h3>
          <div class="center-action">開く <b>→</b></div>
        </div>
      </a>
    </div>
  </section>

  <footer class="landing-footer">
    <span>Management System Version 6</span>
  </footer>
</main>
<script>
(() => {
  const el = document.getElementById('today-label');
  if (!el) return;
  const d = new Date();
  el.textContent = new Intl.DateTimeFormat('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'}).format(d);
})();
</script>
</body>
</html>
