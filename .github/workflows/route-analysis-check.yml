name: Route analysis syntax check
on:
  pull_request:
    paths:
      - 'src/field/route_analysis.js'
      - 'src/core/workers.js'
      - 'src/modules/data_import_hub.js'
      - '.github/workflows/route-analysis-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/field/route_analysis.js
          node --check src/core/workers.js
          node --check src/modules/data_import_hub.js
